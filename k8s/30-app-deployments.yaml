apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kochi-webgis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: kochi-healthcare-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_HOST
              value: postgis
            - name: POSTGRES_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: db-credentials
          readinessProbe:
            httpGet:
              path: /api/config
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: kochi-webgis
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-tileserv
  namespace: kochi-webgis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-tileserv
  template:
    metadata:
      labels:
        app: pg-tileserv
    spec:
      containers:
        - name: pg-tileserv
          image: pramsey/pg_tileserv:latest
          ports:
            - containerPort: 7800
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:change-me-local-only@postgis:5432/kochi_health
---
apiVersion: v1
kind: Service
metadata:
  name: pg-tileserv
  namespace: kochi-webgis
spec:
  selector:
    app: pg-tileserv
  ports:
    - port: 7800
      targetPort: 7800
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-featureserv
  namespace: kochi-webgis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-featureserv
  template:
    metadata:
