        app: pg-featureserv
    spec:
      containers:
        - name: pg-featureserv
          image: pramsey/pg_featureserv:latest
          ports:
            - containerPort: 9000
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:change-me-local-only@postgis:5432/kochi_health
---
apiVersion: v1
kind: Service
metadata:
  name: pg-featureserv
  namespace: kochi-webgis
spec:
  selector:
    app: pg-featureserv
  ports:
    - port: 9000
      targetPort: 9000
