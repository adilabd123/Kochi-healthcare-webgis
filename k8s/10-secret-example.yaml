# EXAMPLE ONLY - local kind cluster. Do not commit real passwords.
# Secret values are base64-encoded by Kubernetes, not encrypted (see study/S4.md).
# Safer alternative to applying this file (PowerShell):
#   kubectl -n kochi-webgis create secret generic db-credentials `
#     --from-literal=POSTGRES_DB=kochi_health --from-literal=POSTGRES_USER=postgres `
#     --from-literal=POSTGRES_PASSWORD=<your-password>
# The password ends up inside postgres:// URLs, so use letters, digits, '-' and '_' only.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: kochi-webgis
  labels:
    app.kubernetes.io/part-of: kochi-healthcare-webgis
type: Opaque
stringData:
  POSTGRES_DB: kochi_health
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: change-me-local-only
