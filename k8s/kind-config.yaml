# kind cluster for the Kochi Healthcare WebGIS (Q11)
#   kind create cluster --name kochi-webgis --config k8s/kind-config.yaml
# NodePort services inside the cluster are mapped to these host ports:
#   api            30080 -> http://localhost:18080
#   pg-tileserv    30780 -> http://localhost:17800
#   pg-featureserv 30900 -> http://localhost:19000
# (different host ports from Docker Compose, so both stacks can run together)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kochi-webgis
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18080
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30780
        hostPort: 17800
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30900
        hostPort: 19000
        listenAddress: "127.0.0.1"
        protocol: TCP
