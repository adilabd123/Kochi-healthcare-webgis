# PostGIS 3.5 + pgRouting 3.8 as a StatefulSet (Q11).
# Stable identity (pod "postgis-0") + its own PersistentVolumeClaim
# ("data-postgis-0", kind's default "standard" local-path StorageClass), so the
# database survives pod deletion: the replacement pod re-attaches the same PVC.
apiVersion: v1
kind: Service
metadata:
  name: postgis
  namespace: kochi-webgis
  labels:
    app: postgis
spec:
  clusterIP: None            # headless: DNS "postgis" -> postgis-0
  selector:
    app: postgis
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgis
  namespace: kochi-webgis
  labels:
    app: postgis
    app.kubernetes.io/part-of: kochi-healthcare-webgis
spec:
  serviceName: postgis
  replicas: 1
  selector:
    matchLabels:
      app: postgis
  template:
    metadata:
      labels:
        app: postgis
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgis
          image: pgrouting/pgrouting:16-3.5-3.8
          imagePullPolicy: IfNotPresent
          ports:
            - name: pg
              containerPort: 5432
          envFrom:
            - secretRef:
                name: db-credentials
          env:
            # Sub-directory so initdb never sees the volume root (lost+found etc.)
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: TZ
              value: Asia/Kolkata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
